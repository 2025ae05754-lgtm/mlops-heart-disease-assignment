apiVersion: apps/v1
kind: Deployment
metadata:
  name: cardiac-risk-api
  labels:
    app: cardiac-risk-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cardiac-risk-api
  template:
    metadata:
      labels:
        app: cardiac-risk-api
    spec:
      containers:
        - name: api-server
          image: cardiac-risk-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
